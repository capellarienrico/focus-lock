name: Build FocusLock APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Restore signing keystore from secret
        env:
          KEYSTORE_B64: ${{ secrets.FOCUSLOCK_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          else
            echo "::warning::FOCUSLOCK_KEYSTORE_BASE64 ausente: APK sera assinado com a chave debug (nao atualiza por cima do instalado)."
          fi

      - name: Build Signed Release APK (Bank-Safe, Non-Debuggable)
        env:
          FOCUSLOCK_KEYSTORE_FILE: ${{ runner.temp }}/release.p12
          FOCUSLOCK_KEYSTORE_PASSWORD: ${{ secrets.FOCUSLOCK_KEYSTORE_PASSWORD }}
          FOCUSLOCK_KEY_ALIAS: ${{ secrets.FOCUSLOCK_KEY_ALIAS }}
          FOCUSLOCK_KEY_PASSWORD: ${{ secrets.FOCUSLOCK_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --stacktrace
          mkdir -p app/build/outputs/apk/debug
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/release/app-release.apk FocusLock.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FocusLock-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub Release v3.6
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v3.6 >/dev/null 2>&1; then
            gh release upload v3.6 FocusLock.apk --clobber
          else
            gh release create v3.6 FocusLock.apk \
              --title "FocusLock v3.6 — Correção Crítica de Detecção de Apps e Modo EXTREME Implacável" \
              --notes "FocusLock v3.6 APK assinado! Correções fundamentais: (1) Detecção de Apps Infalível: corrigido problema com janela de eventos de uso do Android que causava perda de eventos em trocas de tela; (2) Modo EXTREME Seguro e Restrito: bloqueio garantido de todos os apps distrativos, mantendo 100% livres apenas Tela Inicial nativa, Câmera padrão, Telefone/emergência e NFC; (3) Estabilidade do Bloqueador: retorno suave à tela inicial sem loops ou perda de rastreamento." \
              --latest
          fi
