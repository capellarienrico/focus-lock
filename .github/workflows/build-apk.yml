name: Build FocusLock APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Build Signed Release APK (Bank-Safe, Non-Debuggable)
        run: |
          ./gradlew assembleRelease --stacktrace
          mkdir -p app/build/outputs/apk/debug
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/release/app-release.apk FocusLock.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FocusLock-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub Release v3.2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v3.2 >/dev/null 2>&1; then
            gh release upload v3.2 FocusLock.apk --clobber
          else
            gh release create v3.2 FocusLock.apk \
              --title "FocusLock v3.2 — Super App Edition (Filtro Minimalista Só com Contador + Correção da Gaveta de Apps)" \
              --notes "FocusLock v3.2 APK assinado com a chave oficial (release.p12). Basta instalar por cima da versão atual ('Atualizar') sem desinstalar e sem perder nenhuma permissão ou configuração! Inclui: (1) Filtro de Notificações 100% minimalista mostrando apenas o total ('🔕 X notificações filtradas') sem exibir remetente, nome do app ou prévia; (2) Correção completa contra falsos bloqueios ao abrir a Gaveta/Lista de Aplicativos." \
              --latest
          fi
