name: Build FocusLock APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Build Signed Release APK (Bank-Safe, Non-Debuggable)
        run: |
          ./gradlew assembleRelease --stacktrace
          mkdir -p app/build/outputs/apk/debug
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/release/app-release.apk FocusLock.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FocusLock-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub Release v3.3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v3.3 >/dev/null 2>&1; then
            gh release upload v3.3 FocusLock.apk --clobber
          else
            gh release create v3.3 FocusLock.apk \
              --title "FocusLock v3.3 — Ultra-Low Battery & Performance Edition (+ Botão Rápido na Barra do Android)" \
              --notes "FocusLock v3.3 APK assinado com a chave oficial (release.p12) — atualiza direto por cima sem perder nenhuma permissão! Inclui: (1) Arquitetura Ultra-Low Battery com 0% de uso de CPU com a tela apagada (ACTION_SCREEN_OFF), cursor incremental de UsageEvents (-95% Binder IPC), caches em memória sem parsing JSON repetido e hibernação inteligente alinhada ao minuto; (2) Novo Botão Rápido (Quick Settings Tile) na barra do Android para iniciar Foco em 1 toque; (3) Pílula Flutuante arrastável para esquerda/direita e em toda a altura da tela + eliminação de contagem dupla de resumos de grupo (WhatsApp/Instagram); (4) APK otimizado e reduzido via R8." \
              --latest
          fi
