name: Build FocusLock APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Restore signing keystore from secret
        env:
          KEYSTORE_B64: ${{ secrets.FOCUSLOCK_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          else
            echo "::warning::FOCUSLOCK_KEYSTORE_BASE64 ausente: APK sera assinado com a chave debug (nao atualiza por cima do instalado)."
          fi

      - name: Build Signed Release APK (Bank-Safe, Non-Debuggable)
        env:
          FOCUSLOCK_KEYSTORE_FILE: ${{ runner.temp }}/release.p12
          FOCUSLOCK_KEYSTORE_PASSWORD: ${{ secrets.FOCUSLOCK_KEYSTORE_PASSWORD }}
          FOCUSLOCK_KEY_ALIAS: ${{ secrets.FOCUSLOCK_KEY_ALIAS }}
          FOCUSLOCK_KEY_PASSWORD: ${{ secrets.FOCUSLOCK_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --stacktrace
          mkdir -p app/build/outputs/apk/debug
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/release/app-release.apk FocusLock.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FocusLock-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub Release v3.7
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v3.7 >/dev/null 2>&1; then
            gh release upload v3.7 FocusLock.apk --clobber
          else
            gh release create v3.7 FocusLock.apk \
              --title "FocusLock v3.7 — Blindagem Definitiva do Motor em Segundo Plano e Filtro de Notificações" \
              --notes "FocusLock v3.7 APK assinado! Correções vitais de estabilidade e persistência: (1) Loop Watchdog Imparável: corrigida condição de corrida no reacender da tela que encerrava prematuramente o monitoramento do bloqueador; (2) Re-conexão do Filtro de Notificações: alternância forçada de componente do sistema e rebind automático para garantir que a caixa e o resumo de notificações continuem capturando sem parar; (3) Auto-recuperação (ServiceHeartbeat com alarme exato e stopWithTask=false): prevenção contra congelamento de processos em segundo plano pelo Android/OEMs; (4) Diagnóstico aprimorado na tela inicial." \
              --latest
          fi
