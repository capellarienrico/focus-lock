name: Build FocusLock APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Build Signed Release APK (Bank-Safe, Non-Debuggable)
        run: |
          ./gradlew assembleRelease --stacktrace
          mkdir -p app/build/outputs/apk/debug
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/release/app-release.apk FocusLock.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FocusLock-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub Release v3.1
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v3.1 >/dev/null 2>&1; then
            gh release upload v3.1 FocusLock.apk --clobber
          else
            gh release create v3.1 FocusLock.apk \
              --title "FocusLock v3.1 — Super App Edition (Correção de Falso Bloqueio na Gaveta/Lista de Apps)" \
              --notes "FocusLock v3.1 APK assinado com a mesma chave da v3.0 (atualiza por cima sem perder dados!). Corrige falsos bloqueios ao abrir a Gaveta/Lista de Aplicativos da Tela Inicial, Lista de Apps das Configurações ou Seletor Interno de Apps, eliminando ressurreição de eventos antigos pós-Home, respeitando ACTIVITY_PAUSED e liberando buscas de gaveta (Samsung Finder, Xiaomi/POCO Drawer, launchers minimalistas)." \
              --latest
          fi
