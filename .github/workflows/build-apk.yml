name: Build FocusLock APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Restore signing keystore from secret
        env:
          KEYSTORE_B64: ${{ secrets.FOCUSLOCK_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          else
            echo "::warning::FOCUSLOCK_KEYSTORE_BASE64 ausente: APK sera assinado com a chave debug (nao atualiza por cima do instalado)."
          fi

      - name: Build Signed Release APK (Bank-Safe, Non-Debuggable)
        env:
          FOCUSLOCK_KEYSTORE_FILE: ${{ runner.temp }}/release.p12
          FOCUSLOCK_KEYSTORE_PASSWORD: ${{ secrets.FOCUSLOCK_KEYSTORE_PASSWORD }}
          FOCUSLOCK_KEY_ALIAS: ${{ secrets.FOCUSLOCK_KEY_ALIAS }}
          FOCUSLOCK_KEY_PASSWORD: ${{ secrets.FOCUSLOCK_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --stacktrace
          mkdir -p app/build/outputs/apk/debug
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/release/app-release.apk FocusLock.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FocusLock-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub Release v3.4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v3.4 >/dev/null 2>&1; then
            gh release upload v3.4 FocusLock.apk --clobber
          else
            gh release create v3.4 FocusLock.apk \
              --title "FocusLock v3.4 — Modo EXTREME (Bloqueio Total do Aparelho) & Heartbeat Anti-Crash" \
              --notes "FocusLock v3.4 APK assinado com a chave oficial! Novidades desta versão: (1) Modo EXTREME de Bloqueio Total: celular 100% travado instantaneamente, liberando exclusivamente a Câmera e o Telefone/discador de emergência; (2) Chave de Saída Forte e Independente: a Senha Mestre comum não desbloqueia o modo EXTREME — exige uma Senha Forte EXTREME (mínimo 10 caracteres mesclando maiúsculas, minúsculas, dígitos e símbolos com proteção anti-força bruta) ou uma Tag NFC EXTREME dedicada; (3) Alternância Rápida via NFC: encostar a Tag NFC EXTREME ativa ou desativa o modo de qualquer tela; (4) Heartbeat de Auto-Recuperação: serviço em segundo plano auto-regenerativo contra encerramento forçado do sistema operacional (Samsung OneUI, Xiaomi HyperOS, etc.)." \
              --latest
          fi
