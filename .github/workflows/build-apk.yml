name: Build FocusLock APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Build Signed Release APK (Bank-Safe, Non-Debuggable)
        run: |
          ./gradlew assembleRelease --stacktrace
          mkdir -p app/build/outputs/apk/debug
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/release/app-release.apk FocusLock.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FocusLock-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub Release v2.1
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v2.1 >/dev/null 2>&1; then
            gh release upload v2.1 FocusLock.apk --clobber
          else
            gh release create v2.1 FocusLock.apk \
              --title "FocusLock v2.1 (Motor de Bloqueio Overlay + Compatível com Bancos)" \
              --notes "FocusLock v2.1 APK pronto para instalação direta no Android. Corrige o bloqueio de aplicativos no Android 11 a 16 (Samsung, Xiaomi, Motorola, Pixel) usando janela de sobreposição real (WindowManager Overlay) imune ao bloqueio de Background Activity Launch (BAL), visibilidade total no UsageStatsManager e 100% compatível com apps de banco (sem AccessibilityService)." \
              --latest
          fi
