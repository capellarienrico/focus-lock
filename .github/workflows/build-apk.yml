name: Build FocusLock APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Build Signed Release APK (Bank-Safe, Non-Debuggable)
        run: |
          ./gradlew assembleRelease --stacktrace
          mkdir -p app/build/outputs/apk/debug
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/release/app-release.apk FocusLock.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FocusLock-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub Release v3.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v3.0 >/dev/null 2>&1; then
            gh release upload v3.0 FocusLock.apk --clobber
          else
            gh release create v3.0 FocusLock.apk \
              --title "FocusLock v3.0 — Super App Edition (Filtro de Notificações, Seletor Inteligente & Pomodoro)" \
              --notes "FocusLock v3.0 Super App APK pronto para instalação direta no Android (100% compatível com apps de banco, sem AccessibilityService). Inclui: (1) Motor de bloqueio real via WindowManager Overlay imune ao bloqueio BAL do Android 14–16; (2) Filtro de Notificações Minimalista com Pílula Flutuante ('🔕 X notificações filtradas') e Caixa Silenciosa; (3) Seletor Inteligente de Apps categorizado e ordenável por Tempo de Tela, Tamanho, Nome e Instalação; (4) Sessões Rápidas Pomodoro + Modo Monge; (5) Limite Diário de Tempo de Tela por App e Painel de Bem-Estar Digital + Backup JSON." \
              --latest
          fi
